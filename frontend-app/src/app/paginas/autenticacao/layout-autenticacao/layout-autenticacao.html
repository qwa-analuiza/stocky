<div class="autenticacao">
  <!-- ===== Lado esquerdo: apresentação da marca ===== -->
  <aside class="hero">
    <div class="hero__grade" aria-hidden="true"></div>
    <div class="hero__brilho" aria-hidden="true"></div>
    <div class="hero__circulo" aria-hidden="true"></div>

    <a class="hero__marca" routerLink="/login" aria-label="Stockly — início">
      <app-marca />
    </a>

    <div class="hero__conteudo">
      <span class="sobretitulo">Estoque inteligente</span>
      <h2 class="hero__titulo">
        Controle simples.
        <span>Resultados gigantes.</span>
      </h2>
      <p class="hero__texto">
        Tenha clareza sobre cada produto e tome decisões melhores para o seu negócio.
      </p>
    </div>

    <div class="cartao cartao--valor" aria-hidden="true">
      <span class="cartao__icone cartao__icone--roxo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
          <polyline points="16 7 22 7 22 13" />
        </svg>
      </span>
      <span class="cartao__textos">
        <span class="cartao__rotulo">Valor em estoque</span>
        <strong class="cartao__valor">R$ 14.280,00</strong>
      </span>
    </div>

    <div class="cartao cartao--organizacao" aria-hidden="true">
      <span class="cartao__icone cartao__icone--verde">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </span>
      <span class="cartao__textos">
        <span class="cartao__rotulo">Organização</span>
        <strong class="cartao__valor">100% sob controle</strong>
      </span>
    </div>
  </aside>

  <!-- ===== Lado direito: formulário (login ou cadastro) ===== -->
  <main class="formulario">
    <router-outlet />
  </main>
</div>
