# Configuração usada só pelos testes: banco H2 em memória, imitando o MySQL.
spring.datasource.url=jdbc:h2:mem:stockly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

stockly.jwt.segredo=segredo-de-teste-com-mais-de-32-caracteres
stockly.jwt.expiracao-horas=1
stockly.cors.origens=http://localhost:4200
