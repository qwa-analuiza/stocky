spring.application.name=stockly-api

# ===== Banco de dados (MySQL) =====
# Os valores depois do ":" são o padrão para rodar no seu computador.
# Em produção, configure as variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
# createDatabaseIfNotExist=true: o banco "stockly" é criado sozinho na primeira vez.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/stockly?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Ceci@@123}

# Quem cria as tabelas é o Flyway (pasta db/migration); o Hibernate só confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== Servidor =====
server.port=${PORT:8080}

# ===== Stockly =====
# Chave do token: pelo menos 32 caracteres. Em produção use a variável JWT_SECRET!
stockly.jwt.segredo=${JWT_SECRET:stockly-segredo-de-desenvolvimento-troque-em-producao}
stockly.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}
# Endereços do front que podem chamar a API (separados por vírgula)
stockly.cors.origens=${CORS_ORIGENS:http://localhost:4200}
