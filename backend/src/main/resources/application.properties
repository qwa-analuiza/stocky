
spring.application.name=stockly-api

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/stockly?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA e Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Servidor
server.port=${PORT:8080}

# JWT
stockly.jwt.segredo=${JWT_SECRET:stockly-segredo-de-desenvolvimento-troque-em-producao}
stockly.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}

# CORS
stockly.cors.origens=${CORS_ORIGENS:http://localhost:4200}
