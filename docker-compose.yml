# Opcional: sobe um MySQL local com o banco "stockly" já criado.
# Uso (na pasta stockly/): docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: stockly-mysql
    environment:
      MYSQL_DATABASE: stockly
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - stockly-dados:/var/lib/mysql

volumes:
  stockly-dados:
